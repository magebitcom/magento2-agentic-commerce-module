name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Allow phpstan/extension-installer composer plugin
        run: composer config --global allow-plugins.phpstan/extension-installer true

      # A module repository has no Magento to analyse against, so one is built around it.
      - name: Set up Magento project with module
        id: magento
        uses: magebitcom/setup-magento-module-action@v1
        with:
          magento-version: "2.4.7-p3"
          php-version: "8.3"
          composer-auth-user: ${{ secrets.MAGENTO_AUTH_USER }}
          composer-auth-pass: ${{ secrets.MAGENTO_AUTH_PASS }}
          extra-packages: >-
            phpstan/phpstan:^2.0
            bitexpert/phpstan-magento:^0.42
            phpstan/extension-installer:^1.4
            phpunit/phpunit:^9.5
            opis/json-schema:^2.6

      # bitexpert/phpstan-magento only invents a factory class when Composer cannot find a real
      # one, and that fallback is broken on newer phpstan/phpstan. Compiling writes the real
      # factories to disk, so the fallback never runs.
      - name: Generate DI factories for PHPStan
        working-directory: ${{ steps.magento.outputs.project-path }}
        run: |
          php bin/magento module:enable --all
          php -d memory_limit=-1 bin/magento setup:di:compile

      # The factories compiled above are loaded by a Magento autoloader at runtime, not through
      # Composer, so PHPStan has to be pointed at them. Left unfound, it invents its own and trips
      # over the broken fallback described above.
      - name: Run PHPStan
        working-directory: ${{ steps.magento.outputs.project-path }}
        run: |
          cat > phpstan-ci.neon <<'NEON'
          includes:
              - ${{ steps.magento.outputs.module-path }}/phpstan.neon
          parameters:
              scanDirectories:
                  - generated/code
          NEON
          vendor/bin/phpstan analyse "${{ steps.magento.outputs.module-path }}" \
            -c phpstan-ci.neon --no-progress --memory-limit=4G

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Set up Magento project with module
        id: magento
        uses: magebitcom/setup-magento-module-action@v1
        with:
          magento-version: "2.4.7-p3"
          php-version: "8.3"
          composer-auth-user: ${{ secrets.MAGENTO_AUTH_USER }}
          composer-auth-pass: ${{ secrets.MAGENTO_AUTH_PASS }}
          extra-packages: >-
            phpunit/phpunit:^9.5
            opis/json-schema:^2.6

      # Extension attribute interfaces such as CartExtensionInterface are generated, and tests that
      # mock one need the real thing rather than the empty stub that ships in vendor.
      - name: Generate the extension attribute classes
        working-directory: ${{ steps.magento.outputs.project-path }}
        run: |
          php bin/magento module:enable --all
          php -d memory_limit=-1 bin/magento setup:di:compile

      - name: Run unit tests
        working-directory: ${{ steps.magento.outputs.project-path }}
        run: >-
          vendor/bin/phpunit -c dev/tests/unit/phpunit.xml.dist
          "${{ steps.magento.outputs.module-path }}/Test/Unit" --testdox
